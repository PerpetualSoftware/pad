name: Race

on:
  # As ci.yml: main after merge, and release-* so the tagged SHA is
  # race-checked itself (TASK-4253).
  push:
    branches: [main, 'release-*']
  workflow_dispatch:

concurrency:
  # Per branch and SHA, as ci.yml: a release branch cut at a main SHA neither
  # queues behind nor replaces main's run of that SHA.
  group: race-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep identical to CI's shard coverage and non-server race flags.
  GO_RACE_FLAGS: "-race -gcflags=modernc.org/...=-d=checkptr=0"

jobs:
  # internal/server under -race, as 3 shards per driver (TASK-4141). In the
  # ./... race steps it took 2519.644s (SQLite) and 2658.534s (PostgreSQL) of
  # the 2700s per-binary budget on main, sharing ~4 vCPU with every other
  # package. No test or family is more than ~4% of its wall and ~88% of it is
  # serial tests, so there is no slow test to fix; splitting it is the lever.
  # scripts/test-shard.sh says how tests are assigned, and go-server-shards
  # proves the shards cover the package exactly once.
  go-server-race:
    # Backstop only, as on the go job: -timeout=45m fires first.
    timeout-minutes: 75
    name: Go race internal/server (SQLite ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Allow Go to fetch the toolchain go.mod pins
        # See the identical step in the `go` job.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Create web build placeholder for embed
        run: mkdir -p web/build && echo "placeholder" > web/build/.gitkeep

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Built for real, as in the `go` job: internal/server's tests run it.
      - name: Build the materializer bundle for embed
        working-directory: web
        run: npm ci && node scripts/build-materializer.mjs

      - name: Run internal/server shard with race detector
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          run=$(scripts/test-shard.sh regex ./internal/server/ 3 "$SHARD" $GO_RACE_FLAGS)
          go test $GO_RACE_FLAGS -timeout=45m -run "$run" ./internal/server/

      # failure() alone misses a cancelled run, which leaves the branch with no
      # race result at this SHA: that is stop-the-line too (TASK-4224).
      - name: Stop the line on a race failure
        if: failure() || cancelled()
        env:
          FAILED_JOB: Go race internal/server (SQLite ${{ matrix.shard }}/3)
        run: |
          echo "::error::$FAILED_JOB failed at $GITHUB_SHA"
          {
            echo "# STOP THE LINE: a race run on $GITHUB_REF_NAME failed or did not finish"
            echo "Job: $FAILED_JOB"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  go-server-race-postgres:
    # Backstop only, as on the go-postgres job: -timeout=45m fires first.
    timeout-minutes: 75
    name: Go race internal/server (PostgreSQL ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # Same image and digest as the go-postgres job; bump them together.
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: pad
          POSTGRES_PASSWORD: pad
          POSTGRES_DB: pad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Allow Go to fetch the toolchain go.mod pins
        # See the identical step in the `go` job.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Create web build placeholder for embed
        run: mkdir -p web/build && echo "placeholder" > web/build/.gitkeep

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Built for real, as in the `go` job: internal/server's tests run it.
      - name: Build the materializer bundle for embed
        working-directory: web
        run: npm ci && node scripts/build-materializer.mjs

      # internal/server's tests need no PostgreSQL client tools (no pg_dump
      # or psql), so the PGDG install the go-postgres job does is not here.
      - name: Run internal/server shard with race detector against PostgreSQL
        env:
          PAD_TEST_POSTGRES_URL: "postgres://pad:pad@localhost:5432/pad?sslmode=disable"
          PAD_TEST_POSTGRES_TOOLS_URL: "postgres://pad:pad@localhost:5432/pad?sslmode=disable"
          SHARD: ${{ matrix.shard }}
        run: |
          run=$(scripts/test-shard.sh regex ./internal/server/ 3 "$SHARD" $GO_RACE_FLAGS)
          go test $GO_RACE_FLAGS -timeout=45m -count=1 -run "$run" ./internal/server/


      # failure() alone misses a cancelled run, which leaves the branch with no
      # race result at this SHA: that is stop-the-line too (TASK-4224).
      - name: Stop the line on a race failure
        if: failure() || cancelled()
        env:
          FAILED_JOB: Go race internal/server (PostgreSQL ${{ matrix.shard }}/3)
        run: |
          echo "::error::$FAILED_JOB failed at $GITHUB_SHA"
          {
            echo "# STOP THE LINE: a race run on $GITHUB_REF_NAME failed or did not finish"
            echo "Job: $FAILED_JOB"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
