<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Pad">
<!-- Pad mark, small-size variant for 16-48px (TASK-3514; gaps tightened in TASK-3974): pixel-aligned at 16px (tiles 4, gaps 1, inset 1, the favicon tile's grid), so every edge lands on a pixel at 1x, 2x and 3x. Gap/tile is 0.25, near the master's 0.19, which smears at 16px. Scale by whole multiples only. -->
  <rect x="1" y="1" width="4" height="4" rx="0.75" fill="#007bfc"/>
  <rect x="6" y="1" width="4" height="4" rx="0.75" fill="#2f2ffb"/>
  <rect x="11" y="1" width="4" height="4" rx="0.75" fill="#8406fb"/>
  <rect x="1" y="6" width="4" height="4" rx="0.75" fill="#01bc81"/>
  <rect x="6" y="6" width="4" height="4" rx="0.75" fill="#fdb600"/>
  <rect x="11" y="6" width="4" height="4" rx="0.75" fill="#45496c"/>
  <rect x="1" y="11" width="4" height="4" rx="0.75" fill="#0090fd"/>
  <rect x="6" y="11" width="4" height="4" rx="0.75" fill="#004ffb"/>
  <rect x="11" y="11" width="4" height="4" rx="0.75" fill="#424668"/>
</svg>
