<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Pad">
<!-- Pad mark, small-size variant for 16-32px (TASK-3514): pixel-aligned at 16px (tiles 4, gaps 2), so every edge lands on a pixel. Scale by whole multiples only. -->
  <rect x="0" y="0" width="4" height="4" rx="1" fill="#007bfc"/>
  <rect x="6" y="0" width="4" height="4" rx="1" fill="#2f2ffb"/>
  <rect x="12" y="0" width="4" height="4" rx="1" fill="#8406fb"/>
  <rect x="0" y="6" width="4" height="4" rx="1" fill="#01bc81"/>
  <rect x="6" y="6" width="4" height="4" rx="1" fill="#fdb600"/>
  <rect x="12" y="6" width="4" height="4" rx="1" fill="#45496c"/>
  <rect x="0" y="12" width="4" height="4" rx="1" fill="#0090fd"/>
  <rect x="6" y="12" width="4" height="4" rx="1" fill="#004ffb"/>
  <rect x="12" y="12" width="4" height="4" rx="1" fill="#424668"/>
</svg>
