<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Pad">
<!-- Pad org avatar (TASK-3514): the mark on a full-bleed dark tile, sized so every tile clears the circle GitHub crops avatars to in some places (grid span 560 of 1024; its farthest tile corner sits 383 from centre, inside the 512 radius). No edge ring: a circle crop would cut it unevenly. -->
