    <stop offset="0" stop-color="#0b1033"/>
    <stop offset="1" stop-color="#02031a"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0.25" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.08"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="232.0" y="232.0" width="165.7" height="165.7" rx="30.7" fill="#007bfc"/>
  <rect x="232.0" y="232.0" width="165.7" height="165.7" rx="30.7" fill="url(#sheen)"/>
